<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" sizes="180x180" href="ico/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="ico/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="ico/favicon-16x16.png">
<link rel="manifest" href="ico/site.webmanifest">
<title>Mailers Toolkit</title>
<style>
:root{--bg:#f6f4ef;--panel:#fffdf8;--ink:#1e1c18;--muted:#6b665c;--line:#dcd6c8;--accent:#2f5d50;--accent-ink:#fff;--danger:#9b2c2c;color-scheme:light}
[data-theme=dark]{--bg:#161512;--panel:#1f1e1a;--ink:#ece7db;--muted:#a39d8f;--line:#38352d;--accent:#7fbfa8;--accent-ink:#11201b;--danger:#f08a8a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
h1,.brand{font-family:Georgia,"Iowan Old Style",serif;font-weight:600}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.brand{font-size:20px;margin:0}
.brand small{display:block;font:13px/1.4 system-ui,sans-serif;color:var(--muted);margin-top:4px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
select{width:auto}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;min-height:200px;resize:vertical;display:block}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:block}
.nav h2{font:600 13px system-ui,sans-serif;color:var(--muted);margin:14px 10px 4px}
.nav a{display:block;padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.theme{margin-top:auto}
main{padding:28px clamp(16px,4vw,48px);min-width:0;max-width:980px}
h1{font-size:28px;margin:0 0 4px}
.head p{color:var(--muted);margin:0 0 10px}
details.how{margin-bottom:18px}
details summary{cursor:pointer;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin:6px 0 18px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.controls label:has(input[type=checkbox]){flex-direction:row;align-items:center;gap:6px}
.controls input[type=number]{width:120px}
.controls fieldset{border:1px solid var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 12px;margin:0}
.controls legend{font-size:14px;padding:0 4px}
.io label,.out label{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
.io label span,.out label span{display:block;margin-bottom:4px}
.drop.over textarea{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.actions{margin:14px 0}
.hint{color:var(--muted);font-size:13px}
#msg:not(:empty){padding:9px 12px;border-radius:6px;margin:8px 0;border:1px solid var(--line)}
#msg.err{border-color:var(--danger);color:var(--danger)}
#msg.warn{border-color:#b7791f;color:#b7791f}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0}
.stats:empty{display:none}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-weight:600;font-size:17px}
details.preview{margin-top:14px}
iframe#pv{width:100%;height:300px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:8px}
#toasts{position:fixed;bottom:18px;right:18px;display:grid;gap:8px;z-index:9}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;max-width:320px}
.toast.err{background:var(--danger);color:#fff}
@media(max-width:820px){
body{grid-template-columns:1fr}
aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav>div{display:contents}
.nav h2{width:100%;margin:6px 0 0}
.nav a{border:1px solid var(--line);padding:5px 10px}
.theme{margin-top:0}
}
</style>
</head>
<body>
<aside>
  <p class="brand">Mailers Toolkit<small>Tools for email ops. Everything runs in your browser; nothing is uploaded.</small></p>
  <input type="search" id="q" placeholder="Find a tool" aria-label="Find a tool">
  <nav class="nav" id="nav"></nav>
  <button id="theme" class="theme">Dark theme</button>
</aside>
<main id="ws"></main>
<div id="toasts" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const el=id=>document.getElementById(id);
const AMB='O0Il1|';
const SETS={up:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',lo:'abcdefghijklmnopqrstuvwxyz',nu:'0123456789',sp:'!@#$%^&*()-_=+[]{};:,.<>?/~'};
const WORDS='maple river stone cedar harbor lantern meadow orbit pebble quartz ember fjord glacier hollow indigo juniper kettle lilac marble nectar onyx prairie quill raven summit tundra umber velvet willow yonder zephyr basil comet dune falcon granite hazel iris jade koala lagoon mesa nimbus opal parrot saffron timber upland violet walnut aspen bramble coral dolphin echo fern gecko heron island jasmine kayak lupine mango nova oasis plum rune sable thistle vista wren'.split(' ');

/* ---------- helpers ---------- */
function rint(n){const lim=Math.floor(4294967296/n)*n;let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=lim);return x%n}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function lines(t){if(!t)return[];const a=t.split(/\r?\n/);if(a.length&&a[a.length-1]==='')a.pop();return a}
function toast(msg,type){const d=document.createElement('div');d.className='toast '+(type||'');d.textContent=msg;el('toasts').append(d);setTimeout(()=>d.remove(),3200)}
function setMsg(text,type){const m=el('msg');if(!m)return;m.className=type||'';m.textContent=text||''}
function copyText(text){
  if(!text){toast('Nothing to copy yet.','err');return}
  const ok=()=>toast('Copied to clipboard');
  const legacy=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();let k=false;try{k=document.execCommand('copy')}catch(e){}ta.remove();k?ok():toast('Copy failed. Select the text and copy it manually.','err')};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok,legacy);else legacy();
}
function exportAs(ext){
  const text=el('out').value;
  if(!text){toast('Nothing to export yet.','err');return}
  let body=text,type='text/plain;charset=utf-8';
  if(ext==='csv'){body='\uFEFF'+text.split('\n').map(l=>`"${l.replace(/"/g,'""')}"`).join('\r\n');type='text/csv;charset=utf-8'}
  if(ext==='html')type='text/html;charset=utf-8';
  const name=`mailers-${current.id}.${ext}`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(`Exported ${name}`);
}
function readFile(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{el('in').value=r.result;toast(`Loaded ${f.name}`)};
  r.onerror=()=>toast('Could not read that file.','err');
  r.readAsText(f);
}
function decodeQP(s){
  s=s.replace(/=\r?\n/g,'');
  const enc=new TextEncoder();const bytes=[];let bad=0;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='='){const h=s.substr(i+1,2);if(/^[0-9A-Fa-f]{2}$/.test(h)){bytes.push(parseInt(h,16));i+=2;continue}bad++}
    const cp=s.codePointAt(i);if(cp>0xffff)i++;
    for(const b of enc.encode(String.fromCodePoint(cp)))bytes.push(b);
  }
  return{text:new TextDecoder('utf-8').decode(Uint8Array.from(bytes)),bad};
}

/* ---------- tools ---------- */
const TOOLS=[
{id:'password',group:'Generators',name:'Bulk Password Generator',desc:'Create many random passwords at once.',
 how:['Set the length and how many passwords you need.','Tick the character types to include.','Click Generate, then copy or export the list.','Every selected type appears at least once in each password.'],
 output:true,action:'Generate',exports:['txt','csv'],
 controls:`<label>Length <input type="number" id="len" min="4" max="128" value="16"></label>
<label>Quantity <input type="number" id="qty" min="1" max="10000" value="10"></label>
<fieldset><legend>Characters</legend>
<label><input type="checkbox" id="up" checked> Uppercase</label>
<label><input type="checkbox" id="lo" checked> Lowercase</label>
<label><input type="checkbox" id="nu" checked> Numbers</label>
<label><input type="checkbox" id="sp" checked> Special</label>
<label><input type="checkbox" id="amb" checked> Exclude ambiguous (0 O 1 l I |)</label></fieldset>`,
 run(_,c){
   const L=parseInt(c('len').value,10),N=parseInt(c('qty').value,10),amb=c('amb').checked;
   const sets=[['up',SETS.up],['lo',SETS.lo],['nu',SETS.nu],['sp',SETS.sp]].filter(([k])=>c(k).checked).map(([,s])=>amb?[...s].filter(ch=>!AMB.includes(ch)).join(''):s);
   if(!sets.length)return{error:'Choose at least one character type.'};
   if(!(L>=4&&L<=128))return{error:'Length must be between 4 and 128.'};
   if(!(N>=1&&N<=10000))return{error:'Quantity must be between 1 and 10,000.'};
   if(L<sets.length)return{error:`Length must be at least ${sets.length} to include every selected type.`};
   const all=sets.join('');const out=[];
   for(let n=0;n<N;n++){
     const ch=[];for(let i=0;i<L;i++)ch.push(all[rint(all.length)]);
     const pos=shuffleArr([...Array(L).keys()]);
     sets.forEach((s,k)=>{ch[pos[k]]=s[rint(s.length)]});
     out.push(shuffleArr(ch).join(''));
   }
   return{out:out.join('\n'),stats:{'Passwords':N,'Length':L,'Character types':sets.length}};
 }},

{id:'prefix',group:'Generators',name:'Bulk Email Prefix Generator',desc:'Create random email addresses from word combinations.',
 how:['Choose 1, 2, or 3 words per prefix.','Enter your domain, such as example.com.','Set how many addresses you need and click Generate.','Duplicates within the batch are never repeated.'],
 output:true,action:'Generate',exports:['txt','csv'],
 controls:`<label>Words per prefix <select id="k"><option value="1">1 word (maple)</option><option value="2" selected>2 words (mapleriver)</option><option value="3">3 words</option></select></label>
<label>Domain <input type="text" id="dom" value="example.com" style="width:220px"></label>
<label>Quantity <input type="number" id="qty" min="1" max="100000" value="20"></label>`,
 run(_,c){
   const k=parseInt(c('k').value,10),N=parseInt(c('qty').value,10),dom=c('dom').value.trim().toLowerCase();
   if(!/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(dom))return{error:'Enter a valid domain, such as example.com.'};
   if(!(N>=1&&N<=100000))return{error:'Quantity must be between 1 and 100,000.'};
   const max=WORDS.length**k;
   if(N>max)return{error:`Only ${max.toLocaleString()} unique ${k}-word prefixes exist. Lower the quantity or use more words.`};
   const seen=new Set(),res=[];let tries=0;
   while(res.length<N){
     let p='';for(let i=0;i<k;i++)p+=WORDS[rint(WORDS.length)];
     if(!seen.has(p)){seen.add(p);res.push(p+'@'+dom)}
     if(++tries>N*200+10000)return{error:'Could not build enough unique addresses. Try fewer, or more words per prefix.'};
   }
   return{out:res.join('\n'),stats:{'Generated':N,'Possible combinations':max.toLocaleString()}};
 }},

{id:'dedupe',group:'Text',name:'Remove Duplicate Lines',input:true,exports:['txt','csv'],
 desc:'Keep the first copy of each line and drop the rest.',
 how:['Paste text or drop in a file.','Choose whether capital letters should matter.','Click Process. Original order is kept.'],
 action:'Remove duplicates',controls:`<label><input type="checkbox" id="ci"> Case-insensitive (Apple = apple)</label>`,
 run(t,c){
   const L=lines(t),seen=new Set(),ci=c('ci').checked;
   const kept=L.filter(l=>{const key=ci?l.toLowerCase():l;if(seen.has(key))return false;seen.add(key);return true});
   return{out:kept.join('\n'),stats:{'Input lines':L.length,'Output lines':kept.length,'Duplicates removed':L.length-kept.length}};
 }},

{id:'emptylines',group:'Text',name:'Remove Empty Lines',input:true,exports:['txt','csv'],
 desc:'Delete blank lines and keep everything else in order.',
 how:['Paste text or drop in a file.','Optionally include lines that contain only spaces or tabs.','Click Process.'],
 action:'Remove empty lines',controls:`<label><input type="checkbox" id="ws"> Also remove lines with only spaces or tabs</label>`,
 run(t,c){
   const L=lines(t),ws=c('ws').checked;
   const kept=L.filter(l=>ws?l.trim()!=='':l!=='');
   return{out:kept.join('\n'),stats:{'Input lines':L.length,'Output lines':kept.length,'Empty lines removed':L.length-kept.length}};
 }},

{id:'shuffle',group:'Text',name:'Shuffle Lines',input:true,reshuffle:true,exports:['txt','csv'],
 desc:'Put the lines in random order. Each line appears exactly once.',
 how:['Paste text or drop in a file.','Click Shuffle to randomize the order.','Click Reshuffle to shuffle the output again.'],
 action:'Shuffle',controls:'',
 run(t){
   const L=lines(t);
   return{out:shuffleArr(L.slice()).join('\n'),stats:{'Input lines':L.length,'Output lines':L.length}};
 }},

{id:'replace',group:'Text',name:'Match & Replace',input:true,exports:['txt'],
 desc:'Find text and replace every occurrence, with optional regular expressions.',
 how:['Type the text to find and the text to put in its place.','Tick Regex to use patterns such as \\d+ or ^word.','In regex mode, use $1, $2 to reuse matched groups.','Click Replace all.'],
 action:'Replace all',
 controls:`<label>Find <input type="text" id="fd" style="width:240px"></label>
<label>Replace with <input type="text" id="rp" style="width:240px"></label>
<label><input type="checkbox" id="rx"> Regex</label>
<label><input type="checkbox" id="cs"> Case-sensitive</label>`,
 run(t,c){
   const f=c('fd').value,rx=c('rx').checked;
   if(!f)return{error:'Enter the text to find.'};
   const src=rx?f:f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   let re;
   try{re=new RegExp(src,'g'+(c('cs').checked?'':'i'))}catch(e){return{error:'Invalid regular expression: '+e.message}}
   const count=(t.match(re)||[]).length;
   const rep=rx?c('rp').value:c('rp').value.replace(/\$/g,'$$$$');
   return{out:t.replace(re,rep),stats:{'Replacements':count}};
 }},

{id:'decode',group:'Email & HTML',name:'HTML Decoder',input:true,preview:true,exports:['html','txt'],
 desc:'Decode Base64 or Quoted-Printable email content into readable HTML.',
 how:['Choose the encoding used in your source.','Paste the encoded text or drop in a file.','Click Decode. Problems are reported below the button.','Use the preview to check the result; scripts are disabled there.'],
 action:'Decode',
 controls:`<label>Encoding <select id="m"><option value="base64">Base64</option><option value="qp">Quoted-Printable</option></select></label>`,
 run(t,c){
   if(!t.trim())return{error:'Paste or import encoded text first.'};
   if(c('m').value==='base64'){
     let s=t.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
     if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s))return{error:'This is not valid Base64. It contains characters outside A–Z, a–z, 0–9, +, /, and =.'};
     if(s.length%4===1)return{error:'Base64 length is invalid. The text may be cut off.'};
     while(s.length%4)s+='=';
     let bin;try{bin=atob(s)}catch(e){return{error:'Base64 could not be decoded.'}}
     const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
     let out;try{out=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){return{error:'The decoded bytes are not UTF-8 text. Check the encoding setting.'}}
     return{out,stats:{'Input characters':t.length,'Output characters':out.length}};
   }
   const{text,bad}=decodeQP(t);
   return{out:text,stats:{'Input characters':t.length,'Output characters':text.length,'Bad escapes':bad},
     warn:bad?`${bad} "=" sequence(s) were not valid hex escapes and were kept as written.`:''};
 }},

{id:'links',group:'Email & HTML',name:'Remove Links from HTML',input:true,preview:true,exports:['html'],
 desc:'Blank out every href value in HTML while keeping all other markup.',
 how:['Paste HTML or drop in an .html file.','Click Process. Every href value is replaced with an empty string.','Anchor tags, link text, classes, styles, and other attributes are kept.','Absolute, relative, and mailto links are all handled.'],
 action:'Blank hrefs',
 controls:'',
 run(t,c){
   if(!t.trim())return{error:'Paste or import HTML first.'};
   const doc=new DOMParser().parseFromString(t,'text/html');
   const as=[...doc.querySelectorAll('a[href]')];
   as.forEach(a=>a.setAttribute('href',''));
   const changed=as.length;
   const out=/<(html|head)[\s>]/i.test(t)?doc.documentElement.outerHTML:(doc.head.innerHTML.trim()?doc.head.innerHTML+'\n':'')+doc.body.innerHTML;
   return{out,stats:{'Links found':as.length,'Links changed':changed}};
 }},

{id:'speed',group:'Calculators',name:'Sending Speed Calculator',mount:mountSpeed,
 desc:'Work out the exact delay between messages to spread a send evenly over a period.'},

{id:'headers',group:'Email & HTML',name:'Raw Email Header Personalizer',mount:mountHeaders,
 desc:'Replace source-specific Gmail header values with mailer tags, leaving all other headers untouched.'}
];

/* ---------- raw email header personalizer ---------- */
const HP_STORE='mt-hdr-rules';
const HP_MARK='<mark style="background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px">';
const HP_TARGETS={'angle-local':'Local part inside <local@domain>','email-local':'Local part of a bare email address','display-name':'Display name before <email>'};
const HP_DEFAULTS=[
 {header:'Date',mode:'full',source:'placeholder',value:'[Date]',enabled:true},
 {header:'From',mode:'full',source:'custom',value:'[fromName] <[fromEmail]>',parse:'from',enabled:true},
 {header:'Subject',mode:'full',source:'placeholder',value:'[Subject]',enabled:true},
 {header:'To',mode:'full',source:'placeholder',value:'[To]',enabled:true},
 {header:'Message-ID',mode:'partial',target:'angle-local',source:'auto',value:'',enabled:true}
];
const HP_CATS=['Sender & Recipient','Message Information','Email & Domain','Server & Infrastructure','Encoding & Encryption','Random Generation','Date & Time','Negative Text & Brand','Other'];
const HP_PH=[
 ['Sender & Recipient','[First_Part]','Email first part before @'],

 ['Sender & Recipient','[fromEmail]','Sender email address'],

 ['Message Information','[returnPath]','Address accepting automatic responses'],

 ['Random Generation','[5_10,A_F]{2,3}','Random alphanumeric using numbers 5–10 and letters A–F, length 2–3'],
 ['Random Generation','[A_F]{2,3}','Random letters A–F, length 2–3'],
 ['Random Generation','[_5_10_Aa]','Unique random alphanumeric, length 5–10'],
 ['Random Generation','[10_250]','Unique random integer between 10 and 250'],
 ['Random Generation','[arabic_latin_chinese]{5,10}','Random characters from selected language groups, length 5–10. Groups: latin, cyrillic, arabic, devanagari, chinese, hiragana, thai, armenian, georgian, greek, emoji, hebrew, amazigh, katakana, hangul, bengali, tamil, ethiopic'],
 ['Date & Time','[daterdn_Y.m.d-H.M.S]','Dynamic date/time formatting'],
 ['Negative Text & Brand','[negtf]','Negative text of defined ID'],
 ['Negative Text & Brand','[negtfid]','Negative ID'],
 ['Negative Text & Brand','[negtf2]','Negative text of defined ID2'],
 ['Negative Text & Brand','[negtfid2]','Negative ID2'],
 ['Negative Text & Brand','[brand]','Brand address detail']
];
let hpRules=null,hpEditIndex=null,hpEditParse=null,hpPlain='';

function hpOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function hpEsc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hpCharType(s){
  if(!s||!/^[A-Za-z0-9]+$/.test(s))return null;
  return (/[A-Z]/.test(s)?'A':'')+(/[a-z]/.test(s)?'a':'')+(/[0-9]/.test(s)?'N':'');
}
function hpTagInfo(s){
  const type=hpCharType(s);if(!type)return null;
  const n=s.length;
  return{src:s,len:n,upper:/[A-Z]/.test(s),lower:/[a-z]/.test(s),nums:/[0-9]/.test(s),type,tag:`[${n}_${n}_${type}]`};

function hpParseFrom(v){

// Generic Message-ID detector for local parts with dot or hyphen separators.

// Selection: the longest eligible segment. On equal length, the LEFTMOST segment wins (deterministic).

// Applies one rule to one unfolded header value. Returns {ok,newValue,infos} or {ok:false,reason}.

function hpValidateRule(r){

  if(r.mode!=='full'&&r.mode!=='partial')return 'Mode must be Full Value or Partial Value.';
  if(!['placeholder','custom','auto','pattern'].includes(r.source))return 'Replacement type is invalid.';
  if(r.mode==='partial'&&!(typeof r.target==='string'&&hpOwn(HP_TARGETS,r.target)))return 'Partial rules need a target, such as the local part inside <local@domain>.';
  if(r.source!=='auto'&&(typeof r.value!=='string'||!r.value.trim()))return 'Replacement value is empty.';
  if(r.source==='pattern'){const pe=hpCheckPattern(r.value);if(pe)return pe;}

function hpDefaults(){return HP_DEFAULTS.map(x=>({...x}))}
function hpLoad(){

function hpRun(input){
  if(!input.trim())return{error:'Paste the original headers first.'};
  const eol=input.includes('\r\n')?'\r\n':'\n';
  const blocks=[];
  for(const line of input.split(/\r\n|\n/)){
    const prev=blocks[blocks.length-1];
    if(prev&&prev.name&&/^[ \t]/.test(line)){prev.lines.push(line);continue}
    const m=/^([!-9;-~]+):/.exec(line);
    blocks.push({lines:[line],name:m?m[1]:null});
  }
  const byName=new Map();
  hpRules.forEach((r,i)=>byName.set(r.header.toLowerCase(),i));
  const ruleStats=hpRules.map(()=>({matched:0,applied:0}));
  const out=[],reps=[],attention=[],infos=[];
  let total=0,personalized=0,tags=0;
  for(const b of blocks){
    const keep=()=>b.lines.forEach(l=>out.push({t:l,hl:false}));
    if(!b.name){keep();continue}
    total++;
    const idx=byName.get(b.name.toLowerCase());
    if(idx===undefined){keep();continue}
    const rule=hpRules[idx];
    ruleStats[idx].matched++;
    if(!rule.enabled){keep();continue}
    const{value,ws}=hpUnfold(b);
    const r=hpApply(rule,value);
    if(!r.ok){attention.push({field:b.name,rule:idx,original:value,reason:r.reason});keep();continue}
    personalized++;
    ruleStats[idx].applied++;
    if(r.infos&&r.infos.length){tags+=r.infos.length;infos.push(...r.infos)}
    out.push({t:`${b.name}:${ws}${r.newValue}`,hl:true});
    reps.push({field:b.name,original:value,value:r.newValue,rule:idx});
  }

    plain:out.map(x=>x.t).join(eol),
    html:out.map(x=>x.hl?HP_MARK+hpEsc(x.t)+'</mark>':hpEsc(x.t)).join('\n'),
    reps,attention,infos,ruleStats,

function hpUnfold(b){

    <div class="row"><button id="hp-paste">Paste</button><button id="hp-clear">Clear</button></div></section>
  <div class="row actions"><button class="primary" id="hp-run">Personalize Headers</button><button id="hp-copy">Copy Result</button><button id="hp-clear2">Clear</button></div>
  <div id="msg" role="status"></div>
  <dl class="stats" id="hp-stats"></dl>
  <section class="out"><span style="display:block;font-size:14px;color:var(--muted);margin:12px 0 4px">Personalized output (replaced values highlighted)</span>
    <pre id="hp-out" style="border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px;white-space:pre-wrap;word-break:break-all;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:160px;margin:0"></pre></section>
  <details style="margin-top:14px"><summary>Replacements</summary><div id="hp-rep" class="hint" style="margin-top:8px"></div></details>
  <details style="margin-top:10px"><summary>Random tag analysis</summary><div id="hp-tag" class="hint" style="margin-top:8px"></div></details>
  <details open style="margin-top:10px"><summary>Rule report</summary><div id="hp-report" class="hint" style="margin-top:8px"></div></details>`;
  el('hp-count').textContent='';
  hpRenderRules();
  el('hp-saved').textContent='';
  el('hp-q').oninput=hpRenderRules;
  el('hp-add').onclick=()=>hpShowEditor(null);
  el('hp-export').onclick=hpExport;
  el('hp-import').onclick=()=>el('hp-import-file').click();
  el('hp-import-file').onchange=e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>hpImportText(String(rd.result));
    rd.onerror=()=>{el('hp-io-msg').textContent='Could not read that file.';el('hp-io-msg').style.color='var(--danger)'};
    rd.readAsText(f);
  };
  el('hp-reset-rules').onclick=()=>{
    if(!confirm('Reset all replacement rules to the five defaults? Your custom rules will be removed.'))return;
    hpRules=hpDefaults();hpSave();hpRenderRules();el('hp-editor').hidden=true;
    el('hp-io-msg').textContent='Default rules restored.';el('hp-io-msg').style.color='var(--muted)';
  };
  el('hp-list').onclick=e=>{
    const b=e.target.closest('button[data-act]');if(!b)return;
    const i=+b.dataset.i,act=b.dataset.act;
    if(act==='edit')hpShowEditor(i);
    else if(act==='toggle'){hpRules[i].enabled=!hpRules[i].enabled;hpSave();hpRenderRules()}
    else if(act==='del'){
      if(!confirm(`Delete the rule for "${hpRules[i].header}"?`))return;
      hpRules.splice(i,1);hpSave();hpRenderRules();
      if(hpEditIndex===i)el('hp-editor').hidden=true;
    }
  };
  el('ed-mode').onchange=hpEdSync;
  el('ed-source').onchange=hpEdSync;
  el('ed-target').onchange=hpEdSync;
  el('ed-ph-q').oninput=hpPhList;
  el('ed-ph').onchange=e=>{if(el('ed-source').value==='pattern'){el('ed-value').value+=e.target.value}else{el('ed-value').value=e.target.value;el('ed-source').value='placeholder'}hpEdSync()};
  el('ed-save').onclick=hpEdSave;
  el('ed-cancel').onclick=()=>{el('hp-editor').hidden=true};
  el('hp-run').onclick=hpRunUI;
  el('hp-clear').onclick=hpClear;
  el('hp-clear2').onclick=hpClear;
  el('hp-copy').onclick=()=>copyText(hpPlain);
  el('hp-paste').onclick=()=>{
    if(!navigator.clipboard||!navigator.clipboard.readText){toast('Paste is not available here. Use Ctrl/Cmd+V in the box.','err');return}
    navigator.clipboard.readText().then(t=>{el('hp-in').value=t},()=>toast('The browser blocked paste. Use Ctrl/Cmd+V in the box.','err'));
  };
}

const SPEED_DEFAULTS={n:'500',b:'1',d:'1',h:'0',m:'0',s:'0'};
function fmtNum(x,dp){return x.toLocaleString('en-US',{maximumFractionDigits:dp})}
function plural(n,w){return `${fmtNum(n,3)} ${w}${n===1?'':'s'}`}
function formatDuration(ms){
  let sec=ms/1000;
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec-h*3600)/60);
  let s=Math.round((sec-h*3600-m*60)*1000)/1000;
  if(s>=60){s=0;m++}
  if(m>=60){m=0;h++}
  const out=[];
  if(h)out.push(plural(h,'hour'));
  if(m)out.push(plural(m,'minute'));
  if(s>0||!out.length)out.push(plural(s,'second'));
  return out.join(', ');
}
function setSpeedInputs(v){el('sp-n').value=v.n;el('sp-b').value=v.b;el('sp-d').value=v.d;el('sp-h').value=v.h;el('sp-m').value=v.m;el('sp-s').value=v.s}
function calcSpeed(){
  const raw=id=>el(id).value.trim();
  const nRaw=raw('sp-n'),N=Number(nRaw);
  const bRaw=raw('sp-b'),B=Number(bRaw);
  const labels={d:'Days',h:'Hours',m:'Minutes',s:'Seconds'};
  const parts={d:Number(raw('sp-d')),h:Number(raw('sp-h')),m:Number(raw('sp-m')),s:Number(raw('sp-s'))};
  const nOk=nRaw!==''&&Number.isInteger(N)&&N>=1;
  const errs=[];
  if(!nOk)errs.push('Total messages must be a whole number of at least 1.');
  if(bRaw===''||!Number.isInteger(B)||B<1)errs.push('Messages per batch must be a whole number of at least 1.');
  else if(nOk&&B>N)errs.push(`Messages per batch cannot exceed the total of ${fmtNum(N,0)}.`);
  for(const k of Object.keys(labels)){
    if(raw('sp-'+k)===''||!Number.isFinite(parts[k])||parts[k]<0)errs.push(`${labels[k]} must be zero or more.`);
  }
  const res=el('sp-res'),copy=el('sp-copy'),big=el('sp-big');
  if(errs.length){
    setMsg(errs.join(' '),'err');res.innerHTML='';big.innerHTML='';copy.dataset.value='';return;
  }
  const totalMs=((parts.d*24+parts.h)*60+parts.m)*60000+parts.s*1000;
  if(totalMs<=0){
    setMsg('The sending period must be greater than zero.','err');res.innerHTML='';big.innerHTML='';copy.dataset.value='';return;
  }
  const intervals=Math.ceil(N/B);
  const adjusted=totalMs/intervals;
  const single=totalMs/N;
  const whole=Math.round(adjusted);
  const perSec=N*1000/totalMs;
  big.innerHTML=`<div style="color:var(--muted);font-size:14px">Adjusted delay between batches</div><div style="font:600 32px Georgia,'Iowan Old Style',serif;margin:4px 0 12px">${fmtNum(adjusted,6)} ms</div>`;
  const rows=[
    ['Whole milliseconds (copied)',fmtNum(whole,0)],
    ['Delay in seconds',fmtNum(adjusted/1000,6)+' s'],
    ['Equivalent interval',formatDuration(adjusted)],
    ['Batches per period',fmtNum(intervals,0)],
    ['Single-message interval (reference)',fmtNum(single,6)+' ms'],
    ['Messages per second',fmtNum(perSec,6)],
    ['Messages per minute',fmtNum(perSec*60,4)],
    ['Messages per hour',fmtNum(perSec*3600,2)]
  ];
  res.innerHTML=rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  copy.dataset.value=String(whole);
  if(whole===0)setMsg('The adjusted delay is under 0.5 ms, so it rounds to 0. Use fewer batches or a longer period.','warn');
  else setMsg('');
}
function mountSpeed(root){
  root.innerHTML=`
  <header class="head"><h1>Sending Speed Calculator</h1><p>Find the exact delay between messages needed to spread a set number of sends evenly over a period.</p>
    <details class="how"><summary>How to use</summary><ol><li>Enter the total number of messages.</li><li>Enter the sending period in days, hours, minutes, and seconds.</li><li>Results update as you type.</li><li>Click Copy whole ms to take the delay into your sending application.</li></ol></details></header>
  <form class="controls" onsubmit="return false">
    <label>Total messages <input type="number" id="sp-n" min="1" step="1" value="${SPEED_DEFAULTS.n}"></label>
    <label>Days <input type="number" id="sp-d" min="0" step="any" value="${SPEED_DEFAULTS.d}"></label>
    <label>Hours <input type="number" id="sp-h" min="0" step="any" value="${SPEED_DEFAULTS.h}"></label>
    <label>Minutes <input type="number" id="sp-m" min="0" step="any" value="${SPEED_DEFAULTS.m}"></label>
    <label>Seconds <input type="number" id="sp-s" min="0" step="any" value="${SPEED_DEFAULTS.s}"></label>
    <label>Messages per batch <input type="number" id="sp-b" min="1" step="1" value="${SPEED_DEFAULTS.b}"></label>
  </form>
  <div id="msg" role="status"></div>
  <div id="sp-big"></div>
  <dl class="stats" id="sp-res"></dl>
  <div class="row actions"><button class="primary" id="sp-copy">Copy whole ms</button><button id="sp-reset">Reset</button></div>
  <p class="hint">This result assumes evenly spaced sending intervals: each message goes out exactly the calculated delay after the previous one. Real sending adds queue time, retries, and processing delays, so treat the result as a target schedule rather than a guarantee.</p>`;
  root.querySelector('form').addEventListener('input',calcSpeed);
  el('sp-reset').onclick=()=>{setSpeedInputs(SPEED_DEFAULTS);calcSpeed()};
  el('sp-copy').onclick=()=>copyText(el('sp-copy').dataset.value||'');
  calcSpeed();
}

/* ---------- rendering ---------- */
let current=null;
function renderNav(){
  const groups=[...new Set(TOOLS.map(t=>t.group))];
  el('nav').innerHTML=groups.map(g=>`<div><h2>${g}</h2>${TOOLS.filter(t=>t.group===g).map(t=>`<a href="#${t.id}" data-id="${t.id}" data-name="${t.name.toLowerCase()}">${t.name}</a>`).join('')}</div>`).join('');
}
function renderTool(id){
  const t=TOOLS.find(x=>x.id===id)||TOOLS[0];
  current=t;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===t.id));
  try{localStorage.setItem('mt-last',t.id)}catch(e){}
  if(t.mount){el('ws').innerHTML='';t.mount(el('ws'));return}
  el('ws').innerHTML=`
  <header class="head"><h1>${t.name}</h1><p>${t.desc}</p>
    <details class="how"><summary>How to use</summary><ol>${t.how.map(h=>`<li>${h}</li>`).join('')}</ol></details></header>
  ${t.controls?`<form class="controls" onsubmit="return false">${t.controls}</form>`:''}
  ${t.input?`<section class="io"><label><span>Input</span><div class="drop" id="drop"><textarea id="in" spellcheck="false" placeholder="Paste text here, or drop a .txt, .csv, or .html file onto this box."></textarea></div></label>
    <div class="row"><input type="file" id="file" accept=".txt,.csv,.html,.htm,text/plain,text/csv,text/html"><span class="hint">or drop a file onto the input box</span></div></section>`:''}
  <div class="row actions"><button class="primary" id="go">${t.action}</button>${t.reshuffle?'<button id="re">Reshuffle</button>':''}<button id="clr">Clear</button></div>
  <div id="msg" role="status"></div>
  <dl class="stats" id="stats"></dl>
  <section class="out"><label><span>Output</span><textarea id="out" readonly spellcheck="false"></textarea></label>
    <div class="row actions"><button id="cp">Copy results</button>${(t.exports||[]).map(e=>`<button data-x="${e}">Export .${e}</button>`).join('')}</div></section>
  ${t.preview?'<details class="preview"><summary>Preview rendered HTML (scripts disabled)</summary><iframe id="pv" sandbox title="Preview"></iframe></details>':''}`;
  bind();
}
function bind(){
  el('go').onclick=execute;
  if(el('re'))el('re').onclick=()=>{el('in').value=el('out').value;execute()};
  el('clr').onclick=()=>{if(el('in'))el('in').value='';el('out').value='';el('stats').innerHTML='';setMsg('');if(el('pv'))el('pv').srcdoc=''};
  el('cp').onclick=()=>copyText(el('out').value);
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>exportAs(b.dataset.x));
  if(el('file'))el('file').onchange=e=>readFile(e.target.files[0]);
  const d=el('drop');
  if(d){
    ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
    d.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
  }
}
function execute(){
  const t=current;
  const inp=el('in')?el('in').value:'';
  if(t.input&&!inp.trim()){setMsg('Paste or import some text first.','err');toast('Nothing to process yet.','err');return}
  let r;
  try{r=t.run(inp,id=>el(id))}catch(e){r={error:'Unexpected error: '+e.message}}
  if(r.error){setMsg(r.error,'err');toast(r.error,'err');el('out').value='';el('stats').innerHTML='';if(el('pv'))el('pv').srcdoc='';return}
  el('out').value=r.out;
  el('stats').innerHTML=Object.entries(r.stats||{}).map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  if(el('pv'))el('pv').srcdoc=r.out;
  setMsg(r.warn||'',r.warn?'warn':'');
  toast('Done');
}

/* ---------- theme, search, routing ---------- */
function applyTheme(th){document.documentElement.dataset.theme=th;el('theme').textContent=th==='dark'?'Light theme':'Dark theme'}
el('theme').onclick=()=>{
  const n=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(n);
  try{localStorage.setItem('mt-theme',n)}catch(e){}
};
el('q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.nav a').forEach(a=>a.hidden=!a.dataset.name.includes(q));
  document.querySelectorAll('.nav>div').forEach(g=>g.hidden=![...g.querySelectorAll('a')].some(a=>!a.hidden));
};
function route(){
  let saved=null;try{saved=localStorage.getItem('mt-last')}catch(e){}
  renderTool(location.hash.slice(1)||saved||TOOLS[0].id);
}
let th=null;try{th=localStorage.getItem('mt-theme')}catch(e){}
applyTheme(th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
renderNav();
window.addEventListener('hashchange',route);
route();
</script>
